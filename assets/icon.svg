<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>Gothic 1 LockPicker</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="body" x1="64" y1="108" x2="192" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f3ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" stroke="url(#rim)" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#b026ff" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <circle cx="128" cy="138" r="94" stroke-dasharray="2 22.6" stroke-width="6"/>
  </g>
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M94 110V86a34 34 0 0 1 68 0v24" stroke="#00f3ff" stroke-width="15"/>
    <rect x="66" y="108" width="124" height="98" rx="24" fill="#0a0a0f" stroke="url(#body)" stroke-width="12"/>
    <circle cx="128" cy="148" r="12" fill="#ff00ea"/>
    <path d="M128 156v22" stroke="#ff00ea" stroke-width="12"/>
  </g>
</svg>
